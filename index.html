<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ekwangjuyo</title>
    <style>
      #site-intro { position: fixed; inset: 0; z-index: 2147483647; display: grid;
        place-items: center; background: #B4A086; transition: opacity 230ms ease; }
      #site-intro svg { display: block; width: clamp(104px, 9.375vw, 180px); height: auto; }
      #site-intro.is-finished { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #site-intro { display: none; } }
    </style>
    <noscript><style>#site-intro { display: none; }</style></noscript>
  </head>
  <body>
    <div id="site-intro" aria-hidden="true">
<svg viewBox="0 0 180 138" role="img" aria-label="흙덩이가 빚은 항아리를 거쳐 아이보리 항아리로 완성되는 모습">
  <defs><clipPath id="site-intro-silhouette"><path id="site-intro-mask"/></clipPath></defs>
  <path id="site-intro-body" fill="#a79985"/>
  <g clip-path="url(#site-intro-silhouette)">
    <path id="site-intro-color"/>
    <path id="site-intro-star" fill="#976354" opacity="0"
      d="M119 48 Q122 46 120 52 L114 68 Q113 71 117 74 L127 83 Q130 86 126 85 L113 81 Q109 80 109 85 L108 104 Q108 108 105 105 L101 88 Q100 83 96 86 L80 96 Q77 98 78 94 L89 80 Q91 77 87 74 L72 65 Q69 62 74 62 L94 66 Q99 67 102 63 L119 48Z"/>
    <g id="site-intro-grain" fill="#776b5d" opacity=".57">
      <circle cx="56" cy="91" r="1.5"/><circle cx="64" cy="99" r="1.1"/>
      <circle cx="75" cy="104" r="1.35"/><circle cx="84" cy="98" r="1.7"/>
      <circle cx="111" cy="71" r="1.4"/><circle cx="121" cy="65" r="1.1"/>
      <circle cx="128" cy="69" r="1.45"/><circle cx="136" cy="62" r="1.25"/>
    </g>
  </g>
  <path id="site-intro-edge" fill="none" stroke-width="3" stroke-linejoin="round"/>
  <ellipse id="site-intro-opening" fill="#8c7e70" stroke-width="6"/>
</svg>
</div>
    <div id="root"></div>
<script>
(() => {
const overlay = document.getElementById("site-intro");
const root = document.getElementById("root");
let animationComplete = false;
let revealed = false;
const observer = new MutationObserver(revealWhenReady);
observer.observe(root, { childList: true });
const timeout = setTimeout(reveal, 6500);
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) root.inert = true;

function reveal() {
  if (revealed) return;
  revealed = true;
  observer.disconnect();
  clearTimeout(timeout);
  root.inert = false;
  overlay.classList.add("is-finished");
  setTimeout(() => overlay.remove(), 260);
}

function revealWhenReady() {
  if (animationComplete && root.firstElementChild) reveal();
}

const clay = [
  [24,100],[30,85,55,48,79,48],[102,38,139,70,158,100],
  [161,105,163,112,158,116],[152,123,132,125,113,125],
  [99,126,82,126,67,125],[45,125,18,122,20,112],[20,107,22,103,24,100]
];
const shaped = [
  [54,28],[53,19,68,15,89,15],[111,15,127,19,126,28],
  [122,32,144,42,148,65],[153,88,143,105,117,122],
  [113,133,67,133,62,122],[40,108,26,92,31,67],[34,43,57,34,54,28]
];
const finished = [
  [52,23],[50,15,66,10,88,10],[111,10,129,15,128,23],
  [123,28,145,38,150,63],[157,87,144,108,118,124],
  [113,137,67,137,61,124],[35,107,22,88,29,63],[33,40,57,29,52,23]
];
const elements = Object.fromEntries(
  ["mask","body","color","edge","opening","grain","star"].map(id => [id,document.getElementById("site-intro-" + id)])
);
const sand = [229,210,178];
const ivory = [244,234,215];
const duration = 1850;
const clamp = value => Math.max(0, Math.min(1, value));
const ease = value => {const t = clamp(value); return t*t*(3-2*t);};
const mix = (a,b,t) => a + (b-a)*t;
function render(progress) {
  const form = ease(progress / .58);
  const glaze = ease((progress - .48) / .42);
  const points = clay.map((segment,i) => segment.map((value,j) =>
    mix(mix(value,shaped[i][j],form),finished[i][j],glaze).toFixed(2)
  ));
  const path = "M" + points[0].join(" ") + points.slice(1).map(p => "C" + p.join(" ")).join("") + "Z";
  for (const id of ["mask","body","edge"]) elements[id].setAttribute("d",path);
  const tone = "rgb(" + sand.map((value,i) => Math.round(mix(value,ivory[i],glaze))).join(",") + ")";
  const level = mix(114,8,ease(progress / .89));
  elements.color.setAttribute("d","M0 " + level + " Q45 " + (level-3) + " 90 " + level + " T180 " + level + " V138 H0Z");
  elements.color.setAttribute("fill",tone);
  elements.edge.setAttribute("stroke",tone);
  elements.star.setAttribute("opacity",.88*ease((progress-.57)/.34));
  elements.opening.setAttribute("stroke",tone);
  elements.opening.setAttribute("cx","90");
  elements.opening.setAttribute("cy",mix(25,20,glaze));
  elements.opening.setAttribute("rx",mix(8,mix(32,34,glaze),form));
  elements.opening.setAttribute("ry",mix(1.5,mix(7,8,glaze),form));
  elements.opening.setAttribute("opacity",ease((form-.32)/.55));
}
if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
  render(1);
  animationComplete = true;
  revealWhenReady();
} else {
  render(0);
  let start;
  function animate(now) {
    start ??= now;
    const progress = clamp((now-start)/duration);
    render(progress);
    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      animationComplete = true;
      revealWhenReady();
    }
  }
  requestAnimationFrame(animate);
}

})();
</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
